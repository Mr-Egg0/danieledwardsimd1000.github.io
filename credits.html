		<title>Super Picture Poker Rules</title>
		    <style>
			body {
				background-size: auto;
				margin: 0;
				font-family: Monaco, monospace;
			}
			.logo-container {
				background-color: rgb(161, 239, 140);
				padding: 1px 10px;
				text-align: center;
				display: block;
				box-shadow: 0 4px 15px rgb(161, 239, 140);
				position: relative;
				z-index: 2;
			}

			.logo {
				display: block;
				margin: 50px auto;
			}

			.navbar {
				background-color: rgba(57, 60, 159, 1);
				text-align: center;
				padding: 5px 10px;
			}

			.navbar a {
				color: white;
				text-decoration: none;
				padding: 15px 40px;
				font-size: 32px;
				display: inline-block;
				transition: background-color 0.3s, color 0.3s;
			}

			.navbar a:hover {
				background-color: rgb(140, 142, 222);
				color: black;
				border-radius: 5px;
			}

			.specstable {
				background-color: rgb(178, 141, 185);
				font-size: 38px;
				color: rgb(0, 0, 0);
				border: 4px solid rgb(0, 0, 0);
				border-collapse: collapse;
				font-family: "Jersey 10", sans-serif;
			}

		</style>
